services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - /data/coolify/betanalyzer:/app/data
      - /data/coolify/betanalyzer-cache:/app/cache
    env_file:
      - .env
    restart: unless-stopped

  worker:
    build: .
    command: python3 worker.py
    volumes:
      - /data/coolify/betanalyzer:/app/data
      - /data/coolify/betanalyzer-cache:/app/cache
    env_file:
      - .env
    restart: unless-stopped

  nightly:
    build: .
    command: python3 scheduler.py
    volumes:
      - /data/coolify/betanalyzer:/app/data
      - /data/coolify/betanalyzer-cache:/app/cache
    env_file:
      - .env
    restart: unless-stopped

