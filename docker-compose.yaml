services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - /data/coolify/betanalyzer:/app/data
      - cache:/app/cache
    env_file:
      - .env
    restart: unless-stopped

  worker:
    build: .
    command: python worker.py
    volumes:
      - /data/coolify/betanalyzer:/app/data
      - cache:/app/cache
    env_file:
      - .env
    restart: unless-stopped

  nightly:
    build: .
    command: >
      bash -c "
        apt-get update -qq && apt-get install -y -qq cron > /dev/null 2>&1 &&
        env >> /etc/environment &&
        echo '15 4 * * * root bash /app/nightly_docker.sh >> /var/log/nightly.log 2>&1' > /etc/cron.d/nightly &&
        chmod 0644 /etc/cron.d/nightly &&
        crontab /etc/cron.d/nightly &&
        cron -f
      "
    volumes:
      - /data/coolify/betanalyzer:/app/data
      - cache:/app/cache
    env_file:
      - .env
    restart: unless-stopped

volumes:
  cache:
